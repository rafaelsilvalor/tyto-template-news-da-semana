name: news-da-semana
version: 0.1.0
brand: roxo
description: The week's news as a 1080×1350 carousel — "News da semana" and the logo on the left, the slide's news on the right, one bold label and its words after the other.
# Every face the slides set is declared, so the plugin's process can measure them (Tyto ADR 0048).
# CircularXX is licensed: it crosses only under the manifest's `font:CircularXX`, approved at
# install. `tests/faces.test.ts` holds this list equal to the faces the example draws.
faces:
  - { family: CircularXX, weight: 300 }
  - { family: CircularXX, weight: 400 }
  - { family: CircularXX, weight: 700 }
fonts:
  CircularXX: { alternatives: [Inter, Manrope, DM Sans] }
formats: [grid]
slots:
  # The line under "News da semana". Optional: without it the template draws the reference's.
  # A line break in the brief is a line break on the slide.
  subtitulo: { type: rich-text, max: 80 }
  # One slide each, its news one after the other: `**Label:** words`, the label in bold. A line
  # break in the brief is a line break on the slide, so `**Label:**` on a line of its own puts
  # the words under it. `max` counts slides.
  lamina: { type: rich-text, repeat: true, min: 1, max: 10 }
# What a configuration may change (Tyto ADR 0153): the colours. Each default is the reference
# art's, and `tests/values.test.ts` pins them equal to the ones the code falls back to.
values:
  paper: { type: color, default: '#ffffff' }
  # "News da semana" in large.
  title-ink: { type: color, default: '#4d02a1' }
  # A news item's label, its bold words.
  label-ink: { type: color, default: '#460292' }
  # A news item's other words.
  body-ink: { type: color, default: '#646464' }
  # The line under the title.
  subtitle-ink: { type: color, default: '#8c8c8c' }
  # The small spaced words at the top.
  overline-ink: { type: color, default: '#828282' }
